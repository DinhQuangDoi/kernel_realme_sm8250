name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "Pulvis-AOSP" ]
  pull_request:
    branches: [ "Pulvis-AOSP" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential cpio flex libelf-dev \
            libssl-dev lz4 xz-utils zstd python3 python2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc make

      - name: Set up Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /tmp/clang
          echo "/tmp/clang/bin" >> $GITHUB_PATH

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/tmp/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=Amog
          export KBUILD_BUILD_HOST=Us

          KERNEL_DEFCONFIG=vendor/sm8250_defconfig

          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            O=out $KERNEL_DEFCONFIG

          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            O=out -j$(nproc --all)

      - name: Package zip
        run: |
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dtbo.img anykernel/
          cd anykernel
          ZIP_NAME="Bigshot-kernel-AOSP-$(date +'%d-%m-%Y-%H%M').zip"
          zip -r "$ZIP_NAME" .
          mv "$ZIP_NAME" ../out/
          cd ..

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Bigshot-Kernel
          path: out/Bigshot-kernel-AOSP-*.zip
          if-no-files-found: error
