name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "Pulvis-AOSP" ]
  pull_request:
    branches: [ "Pulvis-AOSP" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout KernelSU submodule
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential cpio flex libelf-dev \
            libssl-dev lz4 xz-utils zstd python3 python2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc make

      - name: Set up Clang
        run: |
          mkdir -p /tmp/clang
          cd /tmp/clang
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0-20250423/Clang-20.0.0-20250423.tar.gz" -o clang.tar.gz
          tar -xf clang.tar.gz -C /tmp/clang
          echo "/tmp/clang/bin" >> $GITHUB_PATH

      - name: Fix KernelSU symlink
        run: |
          if [ -L "drivers/kernelsu" ]; then
            echo "Symlink drivers/kernelsu already exists"
          elif [ -d "KernelSU/kernel" ]; then
            ln -sf "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
            echo "Created symlink: drivers/kernelsu -> ../KernelSU/kernel"
          else
            echo "ERROR: KernelSU/kernel not found!"
            exit 1
          fi

      - name: Clean up old driver symlink if broken
        run: |
          if [ -L "drivers/kernelsu" ] && [ ! -e "drivers/kernelsu" ]; then
            rm drivers/kernelsu
            ln -sf "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
            echo "Replaced broken symlink"
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/tmp/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=Amog
          export KBUILD_BUILD_HOST=Us

          KERNEL_DEFCONFIG=vendor/sm8250_defconfig

          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            O=out $KERNEL_DEFCONFIG

          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            O=out -j$(nproc --all)

      - name: Package zip
        run: |
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dtbo.img anykernel/
          cd anykernel
          ZIP_NAME="Bigshot-kernel-AOSP-$(date +'%d-%m-%Y-%H%M').zip"
          zip -r "$ZIP_NAME" .
          mv "$ZIP_NAME" ../out/
          cd ..

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Bigshot-Kernel
          path: out/Bigshot-kernel-AOSP-*.zip
          if-no-files-found: error
